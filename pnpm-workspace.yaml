packages:
  # 指定根目录直接子目录中的包
  - 'apps/*'
  # packages/ 直接子目录中的所有包
  - 'packages/*'
  # components/ 子目录中的所有包
  - 'components/**'
  # 排除测试目录中的包
  - '!**/test/**'
  # 通用工具包
  - 'utils/**'
catalog:
  '@types/node': ^24.10.1
  '@vitejs/plugin-vue': ^6.0.1
  '@vue/tsconfig': ^0.8.1
  '@eslint/js': ^9.39.1
  axios: ^1.13.2
  typescript: ^5.9.3
  vite: ^7.2.4
  vite-plugin-vue-devtools: ^8.0.5
  vue: ^3.5.24
  vue-tsc: ^3.1.4
  eslint: ^9.39.1
  eslint-plugin-react-hooks: ^5.2.0
  eslint-plugin-react-refresh: ^0.4.24
  globals: ^16.5.0
  react-router-dom: ^7.9.6
  typescript-eslint: ^8.46.3
  unocss: ^66.5.6

catalogs:
  ant-design: 
    '@ant-design/v5-patch-for-react-19': "^1.0.3"
    antd: "^5.29.0"
  react19:
    react: "^19.2.0"
    react-dom: "^19.2.0"
    react-redux: "^9.2.0"
    '@reduxjs/toolkit': "^2.10.1"
    '@types/react': "^19.2.2"
    '@types/react-dom': "^19.2.2"
    '@vitejs/plugin-react': "^5.1.0"